<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101109">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bounty Hunters">
  <title>Bounty Hunters</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; --bg: #101109; --ink: #e9e6d8; --dim: #b9b6a6; --gold: #ffcc00; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px 16px; text-align: center; background: var(--bg); transition: opacity .3s; }
    #cover.gone { opacity: 0; pointer-events: none; }
    #cover img { width: 120px; height: 120px; }
    #cover h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
    #cover p { margin: 0; max-width: 340px; color: var(--dim); }
    #help { display: none; flex-direction: column; gap: 10px; align-items: center; }
    #cover.stuck #help { display: flex; }
    #cover.stuck #wait { display: none; }
    a.btn, button { display: inline-block; background: var(--gold); color: var(--bg); border: 0; border-radius: 8px;
      padding: 12px 18px; font: 700 16px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    button.alt { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  </style>
</head>
<body>
  <iframe id="board" title="Florence Bounty Hunters" allow="clipboard-write"></iframe>
  <div id="cover">
    <img src="icon.svg" alt="">
    <h1>FLORENCE BOUNTY HUNTERS</h1>
    <p id="wait">Loading the board…</p>
    <div id="help">
      <p id="helpText">Sign in with the Google account that owns the board, then come back and tap Reload.</p>
      <a class="btn" id="signin" target="_blank" rel="noopener">Sign in</a>
      <button class="alt" id="reload">Reload</button>
    </div>
  </div>
  <script>
    // The board itself is a private Google Apps Script web app; this page only frames it so it can be
    // installed. No data lives here — Google sign-in guards the board.
    const BOARD = "https://script.google.com/macros/s/AKfycbzQsBBPEwbVBY3hbf4uiwH3NeOqVot3btRqwBlpkBFba_tcuyUq-JAeLkfFDpY-DHv9/exec?page=mobile";
    const cover = document.getElementById("cover"), frame = document.getElementById("board");
    const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    document.getElementById("signin").href = BOARD;

    if (iOS) {
      // Safari blocks Google sign-in inside a frame, so iPhone installs the board page itself.
      cover.classList.add("stuck");
      document.getElementById("helpText").innerHTML =
        "On iPhone: tap <b>Open the board</b>, sign in, then tap Share → <b>Add to Home Screen</b>.";
      document.getElementById("signin").textContent = "Open the board";
      document.getElementById("signin").removeAttribute("target");
      document.getElementById("reload").style.display = "none";
    } else {
      let ready = false;
      window.addEventListener("message", e => {
        if (!/(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(e.origin)) return;
        if (e.data && e.data.bh === "ready") { ready = true; cover.classList.add("gone"); }
      });
      frame.src = BOARD;
      setTimeout(() => { if (!ready) cover.classList.add("stuck"); }, 15000);
      document.getElementById("reload").addEventListener("click", () => location.reload());
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
