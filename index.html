<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101109">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bounty Hunters">
  <title>Bounty Hunters</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; --bg: #101109; --ink: #e9e6d8; --dim: #b9b6a6; --gold: #ffcc00; --line: #34362a; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
    #cover { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
    #cover img { width: 112px; height: 112px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .04em; }
    p { margin: 0; max-width: 340px; color: var(--dim); }
    .code { font: 800 44px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .18em; color: var(--gold);
      background: #1b1c14; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px 14px 26px; }
    a.btn, button { display: inline-block; background: var(--gold); color: var(--bg); border: 0; border-radius: 8px;
      padding: 12px 18px; font: 700 16px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    button.alt, a.alt { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .small { font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="cover">
    <img src="icon.svg" alt="">
    <h1>FLORENCE BOUNTY HUNTERS</h1>
    <p id="status">Loading…</p>
    <div class="code" id="code" hidden></div>
    <p id="how" class="small" hidden>On your laptop or another signed-in device, open the board's
      <b>Setup → Paired phones</b> and enter this code.</p>
    <a class="btn alt" id="approveHere" hidden target="_blank" rel="noopener">Approve on this phone</a>
    <button id="retry" hidden>Try again</button>
    <button class="alt" id="browserUse" hidden>Use it in the browser</button>
  </div>
  <script>
    // The board's data and code stay private: this public page holds neither. It pairs the phone
    // once (a 6-digit code the owner approves on the signed-in board), then asks the phone API for
    // the board page and runs it here, full screen. Wrapped so none of these names clash with the
    // board's own code, which runs in this same window afterwards.
    (function () {
    const API = "https://script.google.com/macros/s/AKfycbzSeDBt3Eu08WNEcpR9UfH1zD2efxkaeD56UIAF1Ltc_cvDLR8FovWwOLOWpmar5yrmlQ/exec";
    const BOARD = "https://script.google.com/macros/s/AKfycbzQsBBPEwbVBY3hbf4uiwH3NeOqVot3btRqwBlpkBFba_tcuyUq-JAeLkfFDpY-DHv9/exec";
    const KEY = "bh-key";
    const $ = id => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
      del(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } },
    };
    const say = t => { $("status").textContent = t; };

    async function api(fn, args, key) {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ fn, args: args || [], key }) });
      const j = await r.json();
      if (j.unpaired) { store.del(KEY); throw Object.assign(new Error(j.error), { unpaired: true }); }
      if (!j.ok) throw new Error(j.error || "Phone API error");
      return j.result;
    }

    function failed(e, again) {
      say("Couldn't reach the board (" + e.message + ").");
      $("retry").hidden = false;
      $("retry").onclick = () => { $("retry").hidden = true; again(); };
    }

    async function pair() {
      ["code", "how", "approveHere"].forEach(id => $(id).hidden = true);
      say("Getting a pairing code…");
      let p;
      try { p = await api("pairStart"); } catch (e) { failed(e, pair); return; }
      $("code").textContent = p.code;
      $("approveHere").href = BOARD + "?page=phones&code=" + p.code;
      ["code", "how", "approveHere"].forEach(id => $(id).hidden = false);
      say("Pair this phone");
      const until = Date.now() + p.minutes * 60000;
      const tick = async () => {
        if (Date.now() > until) { pair(); return; }
        try {
          const r = await api("pairCheck", [p.pairId]);
          if (r.key) { store.set(KEY, r.key); ["code", "how", "approveHere"].forEach(id => $(id).hidden = true); boot(); return; }
          if (r.expired) { pair(); return; }
        } catch (e) { /* signal dropped — keep trying */ }
        setTimeout(tick, 3000);
      };
      setTimeout(tick, 3000);
    }

    // The last board page is kept on the phone, so the app opens at once and with no signal.
    // Each launch, the page that opened downloads the current one for next time (PAGE_REFRESH).
    const PAGE_CACHE = "bh-page", PAGE_KEY = "board-page";
    async function keptPage() {
      try { const r = await (await caches.open(PAGE_CACHE)).match(PAGE_KEY); return r ? await r.text() : null; }
      catch (e) { return null; }
    }
    async function keepPage(html) {
      try { await (await caches.open(PAGE_CACHE)).put(PAGE_KEY, new Response(html, { headers: { "Content-Type": "text/html" } })); }
      catch (e) { /* no Cache Storage: the next launch downloads it again */ }
    }

    async function boot() {
      const key = store.get(KEY);
      if (!key) { pair(); return; }
      const kept = await keptPage();
      if (kept) { run(kept, key); return; }
      say("Loading the board…");
      let html;
      try { html = await api("appPage", [], key); }
      catch (e) { if (e.unpaired) pair(); else failed(e, boot); return; }
      await keepPage(html);
      run(html, key);
    }

    function run(html, key) {
      // Runs inside the board page (this script is gone once it's written): 3 s after it opens,
      // fetch the current board page and keep it for the next launch. Writing the page cancels any
      // download this shell started, so it can't be done from here.
      const refresh = "window.addEventListener('load', function () { setTimeout(function () {" +
        "fetch(" + JSON.stringify(API) + ", { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }," +
        " body: JSON.stringify({ fn: 'appPage', args: [], key: " + JSON.stringify(key) + " }) })" +
        ".then(function (r) { return r.json(); }).then(function (j) { if (j.ok && j.result) return caches.open('" + PAGE_CACHE + "')" +
        ".then(function (c) { return c.put('" + PAGE_KEY + "', new Response(j.result, { headers: { 'Content-Type': 'text/html' } })); }); })" +
        ".catch(function () {}); }, 3000); });";
      // The page talks to the phone API through shim.html's __BH transport.
      const head = "<script>window.__BH = { api: " + JSON.stringify(API) + ", key: " + JSON.stringify(key) +
        ", unpaired: function () { try { localStorage.removeItem('" + KEY + "'); caches.delete('" + PAGE_CACHE + "'); } catch (e) {} location.reload(); } };" +
        refresh + "<\/script>" +
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
        '<meta name="theme-color" content="#101109"><link rel="manifest" href="manifest.webmanifest">' +
        '<link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">';
      html = html.replace(/<base target="_top">/i, "").replace(/<head>/i, "<head>" + head);
      document.open();
      document.write(html);
      document.close();
    }

    const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (installed) boot();
    else {
      say("To install: tap Chrome's menu ⋮ → Install app (or Add to Home screen), then open it from your home screen.");
      $("browserUse").hidden = false;
      $("browserUse").onclick = () => { $("browserUse").hidden = true; boot(); };
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    })();
  </script>
</body>
</html>
